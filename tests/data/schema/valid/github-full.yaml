# Exercises most github settings, including both ruleset styles.
github:
  description: Apache Example
  homepage: https://example.apache.org/
  labels:
    - apache
    - example
  collaborators:
    - octocat
  custom_subjects:
    new_pr: "[PR] {title} ({repository})"
    catchall: "[GitHub] {title}"
  features:
    wiki: false
    issues: true
    projects: true
    discussions: true
  enabled_merge_buttons:
    squash: true
    squash_commit_message: PR_TITLE_AND_DESC
    merge: false
    rebase: true
  autolink_jira:
    - EXAMPLE
    - INFRA
  ghp_branch: gh-pages
  ghp_path: /docs
  protected_branches:
    main:
      required_signatures: true
      required_linear_history: true
      required_conversation_resolution: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 2
      required_status_checks:
        strict: true
        contexts:
          - build
        checks:
          - context: unit-tests
            app_id: 12345
  pull_requests:
    del_branch_on_merge: true
    allow_auto_merge: true
    allow_update_branch: true
  rulesets:
    - name: protect main
      branches:
        includes:
          - main
        excludes:
          - dependabot/*
      bypass_teams:
        - example-committers
      required_signatures: true
      required_pull_request_reviews:
        required_approving_review_count: 1
      required_status_checks:
        - build
        - name: unit-tests
          app_slug: github-actions
      required_status_checks_strict: true
    - name: defaults only
    - name: raw tag ruleset
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include:
            - refs/tags/v*
          exclude: []
      rules:
        - type: deletion
  copilot_code_review:
    enabled: true
    review_drafts: false
  dependabot_alerts: true
  dependabot_updates: false
  environments:
    production:
      required_reviewers:
        - id: octocat
          type: User
        - id: 12345
      prevent_self_review: true
      wait_timer: 30
      deployment_branch_policy:
        policies:
          - name: main
          - name: v*
            type: tag
notifications:
  discussions: dev@example.apache.org
